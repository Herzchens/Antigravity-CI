name: Antigravity Review

on:
  workflow_call:
    inputs:
      signing_runner_label:
        description: Deployment-specific label for the signing runner.
        required: true
        type: string
      review_runner_label:
        description: Deployment-specific label for the AGY review runner.
        required: true
        type: string
      publisher_runner_label:
        description: Deployment-specific label for the isolated report publisher runner.
        required: true
        type: string
      signing_public_key_path:
        description: Absolute path to the owner SSH public signing key on the signing runner.
        required: true
        type: string
      review_trusted_public_key_path:
        description: Absolute path to a public-only copy of the trusted signing key on the review runner.
        required: true
        type: string
      expected_reporter_login:
        description: GitHub login expected to own the AGY report comment.
        required: true
        type: string
      reporter_app_client_id:
        description: Optional GitHub App client ID for the preferred report-publisher identity.
        required: false
        default: ''
        type: string
      agy_executable:
        description: Antigravity CLI executable or absolute path.
        required: false
        default: agy
        type: string
      print_timeout_seconds:
        description: Antigravity headless timeout before the wrapper hard timeout.
        required: false
        default: 1200
        type: number
      allow_adb:
        description: Deployment ceiling only. ADB still fails closed until an independently verified runtime boundary is wired.
        required: false
        default: false
        type: boolean
      allow_network:
        description: Deployment ceiling only. Network still fails closed until a domain-scoped runtime boundary is verified.
        required: false
        default: false
        type: boolean
      allow_gui:
        description: Reserved compatibility input. GUI/computer use is rejected in v1.
        required: false
        default: false
        type: boolean
    secrets:
      signing_push_token:
        description: Dedicated write credential used only to update the signed PR branch. Must trigger pull_request synchronize events.
        required: true
      reporter_app_private_key:
        description: Optional GitHub App private key used only by the isolated publisher job.
        required: false
      reporter_token:
        description: Optional fallback token for the distinct report-publisher identity when no GitHub App client ID is configured.
        required: false
      infrastructure_read_token:
        description: Optional read credential for this workflow repository when it is private and differs from the caller repository.
        required: false

permissions:
  contents: read

concurrency:
  group: antigravity-review-${{ github.repository_id }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sign:
    if: >-
      github.event_name == 'pull_request' &&
      contains(fromJSON('["opened","reopened","synchronize","ready_for_review"]'), github.event.action) &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.id == github.event.pull_request.base.repo.id
    runs-on: [self-hosted, Windows, "${{ inputs.signing_runner_label }}"]
    permissions:
      contents: read
    outputs:
      rewritten: ${{ steps.sign.outputs.rewritten }}
      signed_head: ${{ steps.sign.outputs.signed_head }}
      signing_runner_identity: ${{ steps.signing_security.outputs.runner_identity }}
      signing_key_fingerprint: ${{ steps.signing_security.outputs.trusted_fingerprint }}
    steps:
      - name: Clean persistent runner workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            (Join-Path $env:GITHUB_WORKSPACE 'target'),
            (Join-Path $env:GITHUB_WORKSPACE 'infrastructure'),
            (Join-Path $env:RUNNER_TEMP 'antigravity-ci')
          )) {
            Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue
            if (Test-Path -LiteralPath $path) {
              throw "Unable to clean persistent runner path: $path"
            }
          }

      - name: Checkout exact PR head for signing
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ github.token }}
          path: target

      - name: Checkout trusted Antigravity-CI implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.infrastructure_read_token != '' && secrets.infrastructure_read_token || github.token }}
          path: infrastructure

      - name: Verify signing runner security boundary
        id: signing_security
        shell: pwsh
        env:
          INFRA_PATH: ${{ github.workspace }}\infrastructure
          SIGNING_PUBLIC_KEY_PATH: ${{ inputs.signing_public_key_path }}
        run: |
          $security = & (Join-Path $env:INFRA_PATH 'scripts\Assert-RunnerSecurity.ps1') `
            -Role Signing `
            -TrustedPublicKey $env:SIGNING_PUBLIC_KEY_PATH

          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "runner_identity=$($security.Identity)" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "trusted_fingerprint=$($security.TrustedKeyFingerprint)" -Encoding utf8

      - name: Validate PR context and sign exact feature history
        id: sign
        shell: pwsh
        env:
          TARGET_REPOSITORY: ${{ github.repository }}
          EXPECTED_BASE_REF: ${{ github.event.repository.default_branch }}
          TARGET_PATH: ${{ github.workspace }}\target
          INFRA_PATH: ${{ github.workspace }}\infrastructure
          TRUSTED_PUBLIC_KEY_PATH: ${{ inputs.signing_public_key_path }}
          SIGNING_PUSH_TOKEN: ${{ secrets.signing_push_token }}
        run: |
          $ErrorActionPreference = 'Stop'

          $context = & (Join-Path $env:INFRA_PATH 'scripts\Resolve-PullRequestContext.ps1') `
            -EventPath $env:GITHUB_EVENT_PATH `
            -EventName 'pull_request' `
            -ExpectedRepository $env:TARGET_REPOSITORY `
            -ExpectedBaseRef $env:EXPECTED_BASE_REF

          $mergeBase = (& git -C $env:TARGET_PATH merge-base $context.BaseSha $context.HeadSha).Trim().ToLowerInvariant()
          if ($mergeBase -notmatch '^[0-9a-f]{40}$') {
            throw 'Unable to resolve the PR merge base.'
          }

          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PUSH_TOKEN)) {
            throw 'Dedicated signing push token is missing.'
          }

          $encodedCredential = [Convert]::ToBase64String(
            [System.Text.Encoding]::UTF8.GetBytes('x-access-token:' + $env:SIGNING_PUSH_TOKEN)
          )
          Write-Host "::add-mask::$encodedCredential"

          $configEnvironmentNames = @(
            'GIT_CONFIG_COUNT',
            'GIT_CONFIG_KEY_0',
            'GIT_CONFIG_VALUE_0'
          )
          $savedConfigEnvironment = @{}

          foreach ($name in $configEnvironmentNames) {
            $savedConfigEnvironment[$name] = [Environment]::GetEnvironmentVariable($name)
          }

          try {
            $env:GIT_CONFIG_COUNT = '1'
            $env:GIT_CONFIG_KEY_0 = 'http.https://github.com/.extraheader'
            $env:GIT_CONFIG_VALUE_0 = 'AUTHORIZATION: basic ' + $encodedCredential

            $result = & (Join-Path $env:INFRA_PATH 'scripts\Invoke-SigningGate.ps1') `
              -RepositoryPath $env:TARGET_PATH `
              -BaseSha $mergeBase `
              -HeadSha $context.HeadSha `
              -BranchName $context.HeadRef `
              -TrustedPublicKey $env:TRUSTED_PUBLIC_KEY_PATH `
              -ExpectedRemoteHead $context.HeadSha `
              -Push
          }
          finally {
            foreach ($name in $configEnvironmentNames) {
              if ($null -eq $savedConfigEnvironment[$name]) {
                Remove-Item -LiteralPath "Env:$name" -ErrorAction SilentlyContinue
              }
              else {
                Set-Item -LiteralPath "Env:$name" -Value $savedConfigEnvironment[$name]
              }
            }

            $encodedCredential = $null
            $env:SIGNING_PUSH_TOKEN = $null
          }

          $rewritten = $result.RewritePerformed.ToString().ToLowerInvariant()
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "rewritten=$rewritten" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "signed_head=$($result.SignedHeadSha)" -Encoding utf8

          if ($result.RewritePerformed -and -not $result.Pushed) {
            throw 'Signing gate rewrote history without updating the PR branch.'
          }

      - name: Explain signing synchronization barrier
        if: steps.sign.outputs.rewritten == 'true'
        shell: pwsh
        run: |
          Write-Host 'Signed history was pushed. This run stops before AGY review.'
          Write-Host 'The credential used for the push must produce a fresh pull_request synchronize run for the signed head.'

      - name: Dispose signing workspace
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Remove-TreeWithRetry {
            param([Parameter(Mandatory)][string] $Path)

            if (-not (Test-Path -LiteralPath $Path)) {
              return
            }

            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Remove-Item -LiteralPath $Path -Recurse -Force -ErrorAction Stop
                if (Test-Path -LiteralPath $Path) {
                  throw "Path still exists after removal: $Path"
                }
                return
              }
              catch {
                if ($attempt -eq 3) {
                  throw
                }
                Start-Sleep -Seconds 1
              }
            }
          }

          Remove-TreeWithRetry -Path (Join-Path $env:GITHUB_WORKSPACE 'target')
          Remove-TreeWithRetry -Path (Join-Path $env:GITHUB_WORKSPACE 'infrastructure')

  review:
    needs: sign
    if: needs.sign.outputs.rewritten == 'false' && needs.sign.outputs.signed_head == github.event.pull_request.head.sha
    runs-on: [self-hosted, Windows, "${{ inputs.review_runner_label }}"]
    permissions:
      contents: read
      pull-requests: read
    outputs:
      review_runner_identity: ${{ steps.review_security.outputs.runner_identity }}
      report_sha256: ${{ steps.report_digest.outputs.sha256 }}
    steps:
      - name: Clean persistent runner workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            (Join-Path $env:GITHUB_WORKSPACE 'target'),
            (Join-Path $env:GITHUB_WORKSPACE 'infrastructure'),
            (Join-Path $env:RUNNER_TEMP 'antigravity-ci')
          )) {
            Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue
            if (Test-Path -LiteralPath $path) {
              throw "Unable to clean persistent runner path: $path"
            }
          }

      - name: Checkout exact signed PR head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: target

      - name: Checkout trusted Antigravity-CI implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.infrastructure_read_token != '' && secrets.infrastructure_read_token || github.token }}
          path: infrastructure

      - name: Verify isolated review runner security boundary
        id: review_security
        shell: pwsh
        env:
          INFRA_PATH: ${{ github.workspace }}\infrastructure
          AGY_EXECUTABLE: ${{ inputs.agy_executable }}
          REVIEW_TRUSTED_PUBLIC_KEY_PATH: ${{ inputs.review_trusted_public_key_path }}
          SIGNING_RUNNER_IDENTITY: ${{ needs.sign.outputs.signing_runner_identity }}
          SIGNING_KEY_FINGERPRINT: ${{ needs.sign.outputs.signing_key_fingerprint }}
        run: |
          $security = & (Join-Path $env:INFRA_PATH 'scripts\Assert-RunnerSecurity.ps1') `
            -Role Review `
            -TrustedPublicKey $env:REVIEW_TRUSTED_PUBLIC_KEY_PATH `
            -ForbiddenIdentity $env:SIGNING_RUNNER_IDENTITY `
            -ExpectedTrustedKeyFingerprint $env:SIGNING_KEY_FINGERPRINT `
            -AgyExecutable $env:AGY_EXECUTABLE

          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "runner_identity=$($security.Identity)" -Encoding utf8

      - name: Revalidate exact PR head
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          TARGET_PR: ${{ github.event.pull_request.number }}
          TARGET_HEAD: ${{ github.event.pull_request.head.sha }}
          INFRA_PATH: ${{ github.workspace }}\infrastructure
        run: |
          & (Join-Path $env:INFRA_PATH 'scripts\Assert-CurrentPullRequestHead.ps1') `
            -Repository $env:TARGET_REPOSITORY `
            -PrNumber ([int] $env:TARGET_PR) `
            -ExpectedHeadSha $env:TARGET_HEAD | Out-Null

      - name: Prepare trusted exact-head review
        shell: pwsh
        env:
          TARGET_REPOSITORY: ${{ github.repository }}
          TARGET_PR: ${{ github.event.pull_request.number }}
          TARGET_BASE: ${{ github.event.pull_request.base.sha }}
          TARGET_HEAD: ${{ github.event.pull_request.head.sha }}
          TARGET_PATH: ${{ github.workspace }}\target
          INFRA_PATH: ${{ github.workspace }}\infrastructure
          TRUSTED_PUBLIC_KEY_PATH: ${{ inputs.review_trusted_public_key_path }}
          REVIEW_RUN_ID: ${{ github.run_id }}.${{ github.run_attempt }}
        run: |
          $stateRoot = Join-Path $env:RUNNER_TEMP ('antigravity-ci\' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          Remove-Item -LiteralPath $stateRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stateRoot -Force | Out-Null

          & (Join-Path $env:INFRA_PATH 'scripts\Prepare-AgyReview.ps1') `
            -RepositoryPath $env:TARGET_PATH `
            -BaseSha $env:TARGET_BASE `
            -HeadSha $env:TARGET_HEAD `
            -Repository $env:TARGET_REPOSITORY `
            -PrNumber ([int] $env:TARGET_PR) `
            -RunId $env:REVIEW_RUN_ID `
            -TrustedPublicKey $env:TRUSTED_PUBLIC_KEY_PATH `
            -OutputDirectory $stateRoot | Out-Null

      - name: Enforce capability ceiling and runtime readiness
        shell: pwsh
        env:
          INFRA_PATH: ${{ github.workspace }}\infrastructure
          ALLOW_ADB: ${{ inputs.allow_adb }}
          ALLOW_NETWORK: ${{ inputs.allow_network }}
          ALLOW_GUI: ${{ inputs.allow_gui }}
        run: |
          $stateRoot = Join-Path $env:RUNNER_TEMP ('antigravity-ci\' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)

          $capabilityParameters = @{
            ProjectConfigPath = Join-Path $stateRoot 'trusted-project.json'
            AllowAdb = [System.Convert]::ToBoolean($env:ALLOW_ADB)
            AllowNetwork = [System.Convert]::ToBoolean($env:ALLOW_NETWORK)
            AllowGui = [System.Convert]::ToBoolean($env:ALLOW_GUI)
          }

          & (Join-Path $env:INFRA_PATH 'scripts\Test-ProjectCapabilities.ps1') @capabilityParameters | Out-Null

      - name: Run isolated Antigravity review
        shell: pwsh
        env:
          TARGET_REPOSITORY: ${{ github.repository }}
          TARGET_PR: ${{ github.event.pull_request.number }}
          TARGET_HEAD: ${{ github.event.pull_request.head.sha }}
          TARGET_PATH: ${{ github.workspace }}\target
          INFRA_PATH: ${{ github.workspace }}\infrastructure
          REVIEW_RUN_ID: ${{ github.run_id }}.${{ github.run_attempt }}
          AGY_EXECUTABLE: ${{ inputs.agy_executable }}
          AGY_PRINT_TIMEOUT: ${{ inputs.print_timeout_seconds }}
        run: |
          $stateRoot = Join-Path $env:RUNNER_TEMP ('antigravity-ci\' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)

          & (Join-Path $env:INFRA_PATH 'scripts\Invoke-AgyReview.ps1') `
            -RepositoryPath $env:TARGET_PATH `
            -PromptPath (Join-Path $stateRoot 'agy-prompt.txt') `
            -ReportSchemaPath (Join-Path $env:INFRA_PATH 'schemas\agy-report.schema.json') `
            -OutputPath (Join-Path $stateRoot 'agy-report.json') `
            -EnvelopePath (Join-Path $stateRoot 'agy-envelope.json') `
            -ExpectedRepository $env:TARGET_REPOSITORY `
            -ExpectedPr ([int] $env:TARGET_PR) `
            -ExpectedHeadSha $env:TARGET_HEAD `
            -ExpectedRunId $env:REVIEW_RUN_ID `
            -AgyExecutable $env:AGY_EXECUTABLE `
            -PrintTimeoutSeconds ([int] $env:AGY_PRINT_TIMEOUT) | Out-Null

      - name: Hash validated report
        id: report_digest
        shell: pwsh
        env:
          REPORT_PATH: ${{ runner.temp }}\antigravity-ci\${{ github.run_id }}-${{ github.run_attempt }}\agy-report.json
        run: |
          $hash = (Get-FileHash -LiteralPath $env:REPORT_PATH -Algorithm SHA256 -ErrorAction Stop).Hash.ToLowerInvariant()
          if ($hash -notmatch '^[0-9a-f]{64}$') {
            throw 'Unable to compute a valid SHA-256 digest for the validated AGY report.'
          }

          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "sha256=$hash" -Encoding utf8

      - name: Upload validated report for isolated publisher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agy-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\antigravity-ci\${{ github.run_id }}-${{ github.run_attempt }}\agy-report.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Dispose reviewed workspace and review state
        if: always()
        shell: pwsh
        env:
          TARGET_PATH: ${{ github.workspace }}\target
        run: |
          $ErrorActionPreference = 'Stop'

          function Remove-TreeWithRetry {
            param(
              [Parameter(Mandatory)]
              [string] $Path
            )

            if (-not (Test-Path -LiteralPath $Path)) {
              return
            }

            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Remove-Item -LiteralPath $Path -Recurse -Force -ErrorAction Stop
                return
              }
              catch {
                if ($attempt -eq 3) {
                  throw
                }

                Start-Sleep -Seconds 1
              }
            }
          }

          Remove-TreeWithRetry -Path $env:TARGET_PATH
          Remove-TreeWithRetry -Path (Join-Path $env:GITHUB_WORKSPACE 'infrastructure')

          $stateRoot = Join-Path $env:RUNNER_TEMP ('antigravity-ci\' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          Remove-TreeWithRetry -Path $stateRoot

  publisher:
    needs: [sign, review]
    if: needs.sign.outputs.rewritten == 'false' && needs.sign.outputs.signed_head == github.event.pull_request.head.sha
    runs-on: [self-hosted, Windows, "${{ inputs.publisher_runner_label }}"]
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Clean persistent runner workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            (Join-Path $env:GITHUB_WORKSPACE 'target'),
            (Join-Path $env:GITHUB_WORKSPACE 'infrastructure'),
            (Join-Path $env:RUNNER_TEMP 'antigravity-ci')
          )) {
            Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue
            if (Test-Path -LiteralPath $path) {
              throw "Unable to clean persistent runner path: $path"
            }
          }

      - name: Checkout trusted Antigravity-CI implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.infrastructure_read_token != '' && secrets.infrastructure_read_token || github.token }}
          path: infrastructure

      - name: Verify isolated publisher runner security boundary
        shell: pwsh
        env:
          INFRA_PATH: ${{ github.workspace }}\infrastructure
          SIGNING_RUNNER_IDENTITY: ${{ needs.sign.outputs.signing_runner_identity }}
          REVIEW_RUNNER_IDENTITY: ${{ needs.review.outputs.review_runner_identity }}
        run: |
          $securityParameters = @{
            Role = 'Publisher'
            ForbiddenIdentity = $env:SIGNING_RUNNER_IDENTITY
            ForbiddenIdentities = @($env:REVIEW_RUNNER_IDENTITY)
          }

          & (Join-Path $env:INFRA_PATH 'scripts\Assert-RunnerSecurity.ps1') @securityParameters | Out-Null

      - name: Download validated AGY report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: agy-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\antigravity-ci\${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify downloaded report digest
        shell: pwsh
        env:
          REPORT_PATH: ${{ runner.temp }}\antigravity-ci\${{ github.run_id }}-${{ github.run_attempt }}\agy-report.json
          EXPECTED_REPORT_SHA256: ${{ needs.review.outputs.report_sha256 }}
        run: |
          if ($env:EXPECTED_REPORT_SHA256 -notmatch '^[0-9a-f]{64}$') {
            throw 'Review job did not provide a valid report SHA-256 digest.'
          }

          $actual = (Get-FileHash -LiteralPath $env:REPORT_PATH -Algorithm SHA256 -ErrorAction Stop).Hash.ToLowerInvariant()
          if ($actual -cne $env:EXPECTED_REPORT_SHA256) {
            throw 'Downloaded AGY report digest does not match the validated review output.'
          }

      - name: Revalidate exact PR head before publication
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          TARGET_PR: ${{ github.event.pull_request.number }}
          TARGET_HEAD: ${{ github.event.pull_request.head.sha }}
          INFRA_PATH: ${{ github.workspace }}\infrastructure
        run: |
          & (Join-Path $env:INFRA_PATH 'scripts\Assert-CurrentPullRequestHead.ps1') `
            -Repository $env:TARGET_REPOSITORY `
            -PrNumber ([int] $env:TARGET_PR) `
            -ExpectedHeadSha $env:TARGET_HEAD | Out-Null

      - name: Create GitHub App reporter token
        id: reporter_app
        if: inputs.reporter_app_client_id != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ inputs.reporter_app_client_id }}
          private-key: ${{ secrets.reporter_app_private_key }}

      - name: Publish report with GitHub App identity
        if: inputs.reporter_app_client_id != ''
        shell: pwsh
        env:
          AGY_REPORTER_TOKEN: ${{ steps.reporter_app.outputs.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          TARGET_PR: ${{ github.event.pull_request.number }}
          TARGET_HEAD: ${{ github.event.pull_request.head.sha }}
          INFRA_PATH: ${{ github.workspace }}\infrastructure
          REVIEW_RUN_ID: ${{ github.run_id }}.${{ github.run_attempt }}
          EXPECTED_REPORTER_LOGIN: ${{ inputs.expected_reporter_login }}
        run: |
          $stateRoot = Join-Path $env:RUNNER_TEMP ('antigravity-ci\' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)

          & (Join-Path $env:INFRA_PATH 'scripts\Publish-AgyReport.ps1') `
            -ReportPath (Join-Path $stateRoot 'agy-report.json') `
            -ExpectedRepository $env:TARGET_REPOSITORY `
            -ExpectedPr ([int] $env:TARGET_PR) `
            -ExpectedHeadSha $env:TARGET_HEAD `
            -ExpectedRunId $env:REVIEW_RUN_ID `
            -ExpectedReporterLogin $env:EXPECTED_REPORTER_LOGIN | Out-Null

      - name: Publish report with fallback token identity
        if: inputs.reporter_app_client_id == ''
        shell: pwsh
        env:
          AGY_REPORTER_TOKEN: ${{ secrets.reporter_token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          TARGET_PR: ${{ github.event.pull_request.number }}
          TARGET_HEAD: ${{ github.event.pull_request.head.sha }}
          INFRA_PATH: ${{ github.workspace }}\infrastructure
          REVIEW_RUN_ID: ${{ github.run_id }}.${{ github.run_attempt }}
          EXPECTED_REPORTER_LOGIN: ${{ inputs.expected_reporter_login }}
        run: |
          $stateRoot = Join-Path $env:RUNNER_TEMP ('antigravity-ci\' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)

          & (Join-Path $env:INFRA_PATH 'scripts\Publish-AgyReport.ps1') `
            -ReportPath (Join-Path $stateRoot 'agy-report.json') `
            -ExpectedRepository $env:TARGET_REPOSITORY `
            -ExpectedPr ([int] $env:TARGET_PR) `
            -ExpectedHeadSha $env:TARGET_HEAD `
            -ExpectedRunId $env:REVIEW_RUN_ID `
            -ExpectedReporterLogin $env:EXPECTED_REPORTER_LOGIN | Out-Null

      - name: Dispose publisher state
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Remove-TreeWithRetry {
            param([Parameter(Mandatory)][string] $Path)

            if (-not (Test-Path -LiteralPath $Path)) {
              return
            }

            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Remove-Item -LiteralPath $Path -Recurse -Force -ErrorAction Stop
                if (Test-Path -LiteralPath $Path) {
                  throw "Path still exists after removal: $Path"
                }
                return
              }
              catch {
                if ($attempt -eq 3) {
                  throw
                }
                Start-Sleep -Seconds 1
              }
            }
          }

          Remove-TreeWithRetry -Path (Join-Path $env:GITHUB_WORKSPACE 'infrastructure')
          Remove-TreeWithRetry -Path (Join-Path $env:RUNNER_TEMP 'antigravity-ci')
